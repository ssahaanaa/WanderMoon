# Netlify settings. Netlify reads this file when you connect the repository.
[build]
  command = "npm run build"
  publish = "dist"

# Single page app: every URL (like /packages) serves index.html, React Router shows the page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same security headers as vite.config.js
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://picsum.photos https://fastly.picsum.photos; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
